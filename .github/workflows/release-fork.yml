name: Build/release (Fork)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Fix macOS file association icons (fork only)
        if: startsWith(matrix.os, 'macos')
        run: |
          # Disable notarization
          jq 'del(.build.mac.notarize, .build.mac.identity)' package.json > package.json.tmp && mv package.json.tmp package.json
          # Duplicate icon to avoid EEXIST when .azw3 and .azw both point to azw3.icns
          cp assets/icons/azw3.icns assets/icons/azw.icns
          jq '.build.fileAssociations[5].icon = "assets/icons/azw"' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Clean dist directory
        run: rm -rf dist/

      - name: Build/release Electron app
        uses: samuelmeuli/action-electron-builder@v1.6.0
        with:
          build_script_name: "build"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
