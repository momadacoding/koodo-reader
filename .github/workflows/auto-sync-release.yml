name: Auto sync upstream and release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if already synced'
        required: false
        default: false
        type: boolean

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      our_tag: ${{ steps.decide.outputs.our_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/koodo-reader/koodo-reader.git
          git fetch upstream --tags

      - name: Get upstream latest release
        id: upstream
        run: |
          latest=$(gh api repos/koodo-reader/koodo-reader/releases/latest --jq '.tag_name')
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to sync/build
        id: decide
        run: |
          upstream_tag="${{ steps.upstream.outputs.tag }}"
          our_tag="${upstream_tag}-acorny"
          force="${{ github.event.inputs.force }}"
          dev_sha="$(git rev-parse HEAD)"

          if [ "$force" = "true" ]; then
            echo "Force build requested"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "our_tag=$our_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "$our_tag" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "$our_tag")"

            if [ "$tag_sha" = "$dev_sha" ]; then
              echo "Already synced to $our_tag at $dev_sha"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $our_tag points to $tag_sha, but dev is $dev_sha"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "our_tag=$our_tag" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Need to sync: $upstream_tag -> $our_tag"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "our_tag=$our_tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream to dev
        if: steps.decide.outputs.should_build == 'true'
        run: |
          upstream_tag="${{ steps.upstream.outputs.tag }}"

          git checkout dev

          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "dev already contains upstream/dev"
          else
            git merge --no-ff --no-commit upstream/dev || {
              echo "Merge failed; resolve conflicts manually"
              git status --short
              exit 1
            }
            git restore --source=HEAD --staged --worktree .github/workflows
            git commit --allow-empty -m "Merge upstream $upstream_tag"
          fi

      - name: Push synced dev
        if: steps.decide.outputs.should_build == 'true'
        run: |
          git push origin dev

      - name: Create and push release tag
        if: steps.decide.outputs.should_build == 'true'
        run: |
          our_tag="${{ steps.decide.outputs.our_tag }}"
          git tag -f "$our_tag"
          git push -f origin "$our_tag"
          echo "Created tag: $our_tag"

  trigger-build:
    needs: check-and-sync
    if: needs.check-and-sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger build workflow
        run: |
          our_tag="${{ needs.check-and-sync.outputs.our_tag }}"
          echo "Triggering build for tag: $our_tag"
          gh workflow run release-fork.yml --ref "$our_tag" -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
